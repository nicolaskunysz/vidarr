<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vidarr.is - Under Construction</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --amber-color: #ff9f1c; /* Cinematic yellow/orange */
            --amber-glow: rgba(255, 159, 28, 0.6);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 50%, #121212 0%, #020202 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 15vw rgba(0,0,0,0.95);
            pointer-events: none;
            z-index: 5;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.25) 50%, rgba(0,0,0,0.25));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            /* Using max-content forces the container to be exactly as wide as the widest element (the domain text) */
            width: max-content; 
            max-width: 95vw;
        }

        .domain-text {
            font-size: 15vw;
            font-weight: 900;
            line-height: 0.85;
            color: #ffffff;
            letter-spacing: -0.04em;
            margin: 0;
            padding: 0;
            text-shadow: 0 0 40px rgba(255,255,255,0.15);
            text-align: center;
        }

        .sub-text {
            font-size: 3.2vw; /* Increased size */
            font-weight: 700;
            color: var(--amber-color);
            letter-spacing: 0.22em; /* Tighter letter spacing to allow larger font without exceeding bounds */
            margin-top: 1.5vw;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(255, 159, 28, 0.4);
            /* Bounding the text strictly */
            max-width: 100%;
            text-align: center;
        }

        .progress-container {
            width: 98%; /* Perfectly nested within the width of the text */
            height: 5px;
            background-color: rgba(255, 255, 255, 0.08);
            margin-top: 2.5vw;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 25%;
            background-color: var(--amber-color);
            box-shadow: 0 0 15px var(--amber-glow);
            border-radius: 4px;
            animation: slide-indeterminate 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        @keyframes slide-indeterminate {
            0% {
                left: -35%;
                width: 20%;
            }
            50% {
                width: 45%;
            }
            100% {
                left: 115%;
                width: 20%;
            }
        }

        .footer {
            position: absolute;
            bottom: 2rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.25);
            font-family: 'Courier New', Courier, monospace; /* Monospace for technical look */
            letter-spacing: 0.1em;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="main-container">
        <h1 class="domain-text">vidarr.is</h1>
        <h2 class="sub-text">Under Construction</h2>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <div class="footer">
        SYS_VER: 4.9.2 // &copy; 2026 VIDARR.IS SECURE HOST
    </div>
</body>
</html>
