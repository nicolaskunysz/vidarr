<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vidarr.is - Under Construction</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --amber-color: #ff9f1c; /* Cinematic yellow/orange */
            --amber-glow: rgba(255, 159, 28, 0.6);
            --bg-dark: #050505;
            --text-light: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            /* min-height 100dvh perfectly adapts to mobile browsers with dynamic address bars */
            min-height: 100dvh;
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 100%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevents scrollbars from breaking the cinematic feel */
        }

        .vignette {
            position: absolute;
            inset: 0; /* Shorthand for top, right, bottom, left 0 */
            box-shadow: inset 0 0 clamp(5rem, 15vw, 20rem) rgba(0,0,0,0.95);
            pointer-events: none;
            z-index: 5;
        }

        .scanlines {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.3));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: stretch; /* Forces children to span the full width dictated by the largest element */
            z-index: 10;
            /* max-content ensures the container is exactly as wide as the massive domain text */
            width: max-content; 
            max-width: 90vw; /* Prevents edge-touching on extreme narrow screens */
        }

        .domain-text {
            /* clamp() ensures text never gets too small on mobile or absurdly huge on ultrawide monitors */
            font-size: clamp(3.5rem, 15vw, 15rem);
            font-weight: 900;
            line-height: 0.85;
            color: var(--text-light);
            letter-spacing: -0.04em;
            margin: 0;
            padding: 0;
            text-shadow: 0 0 40px rgba(255,255,255,0.15);
            text-align: center;
            white-space: nowrap;
        }

        .sub-text {
            /* Scales proportionally with the domain text */
            font-size: clamp(0.75rem, 3.2vw, 3.2rem);
            font-weight: 700;
            color: var(--amber-color);
            /* Calculated tracking to stretch nicely without spilling over */
            letter-spacing: clamp(0.1em, 0.3vw, 0.5em); 
            margin-top: clamp(1rem, 2vw, 2rem);
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(255, 159, 28, 0.4);
            text-align: center;
        }

        .progress-container {
            width: 100%; /* Perfectly fills the width created by domain-text */
            height: clamp(3px, 0.5vw, 6px);
            background-color: rgba(255, 255, 255, 0.08);
            margin-top: clamp(1.5rem, 3vw, 3rem);
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 30%;
            background-color: var(--amber-color);
            box-shadow: 0 0 15px var(--amber-glow);
            border-radius: 4px;
            animation: slide-indeterminate 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        @keyframes slide-indeterminate {
            0% { left: -35%; width: 20%; }
            50% { width: 50%; }
            100% { left: 115%; width: 20%; }
        }

        .footer {
            position: absolute;
            bottom: clamp(1rem, 3dvh, 3rem);
            font-size: clamp(0.6rem, 1vw, 0.9rem);
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 0.1em;
            z-index: 10;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <main class="main-container">
        <h1 class="domain-text">vidarr.is</h1>
        <h2 class="sub-text">Under Construction</h2>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </main>

    <footer class="footer">
        &copy; 2026 VIDARR.IS // DEPLOYMENT PENDING
    </footer>
</body>
</html>
