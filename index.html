<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDARR.IS // THE LIST</title>
<style>
    /* Global UI Font - Helvetica/Roboto */
    body {
        background-color: #000000;
        color: #FFFFFF;
        font-family: "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif;
        margin: 0;
        padding: 2rem 4rem;
        line-height: 1.5;
    }

    /* --- SITE HEADER & NAV --- */
    .site-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 2px solid #FFFFFF;
        padding-bottom: 1rem;
        margin-bottom: 1rem;
        max-width: 1200px;
    }

    .site-title {
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: 0.05em;
        margin: 0;
        color: #FF0000; /* Stark Red Banner */
        text-transform: uppercase;
    }

    .header-controls {
        display: flex;
        align-items: center;
        margin-bottom: 0.25rem;
    }

    .search-box {
        display: flex;
        align-items: center;
    }

    .search-box input {
        background-color: #000000;
        color: #FFFFFF;
        border: 1px solid #555555;
        padding: 0.5rem 1rem;
        font-family: inherit;
        width: 250px;
    }

    .search-box input:focus {
        outline: none;
        border-color: #FFFFFF;
    }

    /* Secret link to Under Construction page */
    .secret-btn {
        color: #111111; /* Very dark grey, almost invisible */
        text-decoration: none;
        margin-left: 1rem;
        font-weight: bold;
        cursor: crosshair;
        transition: color 0.2s;
    }

    .secret-btn:hover {
        color: #555555;
    }

    .site-nav {
        display: flex;
        gap: 2rem;
        margin-bottom: 3rem;
        max-width: 1200px;
        font-size: 0.9rem;
        color: #AAAAAA;
    }

    .site-nav a {
        color: #AAAAAA;
        text-decoration: none;
        font-weight: bold;
    }

    .site-nav a:hover, .site-nav a.active {
        color: #FFFFFF;
    }

    /* --- LAYOUT WRAPPER --- */
    .layout-wrapper {
        display: flex;
        gap: 3rem;
        max-width: 1200px;
    }

    /* --- SIDEBAR / INDEX --- */
    .sidebar {
        width: 250px;
        flex-shrink: 0;
    }

    .sidebar h3 {
        font-size: 1rem;
        border-bottom: 1px solid #555555;
        padding-bottom: 0.5rem;
        margin-top: 0;
        color: #FFFFFF;
        font-weight: bold;
    }

    .backlog-list {
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 0.85rem;
        color: #CCCCCC;
    }

    .backlog-list li {
        margin-bottom: 1.5rem;
    }

    .backlog-list .date {
        display: block;
        font-size: 0.75rem;
        color: #777777;
        margin-bottom: 0.2rem;
        font-weight: bold;
    }

    .backlog-list .current {
        color: #FFFFFF;
        font-weight: bold;
    }

    .backlog-list .current::before {
        content: "> ";
    }

    /* --- MAIN CONTENT & LIST --- */
    .main-content {
        flex-grow: 1;
        min-width: 0; 
    }

    .list-container {
        /* Raw Data Font Enforced Here */
        font-family: "Courier New", Courier, monospace;
        
        border: 1px solid #555555;
        max-height: 60vh;
        width: 100%;
        overflow-y: scroll;
        padding: 1rem;
        margin-bottom: 1.5rem;
        background-color: #030303;
    }

    .list-container::-webkit-scrollbar {
        width: 24px;
        background: #111111;
        border-left: 1px solid #444444;
    }
    .list-container::-webkit-scrollbar-track {
        background: #050505;
        border-left: 1px solid #333333;
    }
    .list-container::-webkit-scrollbar-thumb {
        background: #DDDDDD;
        border: 3px solid #000000;
        min-height: 40px;
    }
    .list-container::-webkit-scrollbar-thumb:hover {
        background: #FFFFFF;
    }
    
    .list-container::-webkit-scrollbar-button:vertical:decrement {
        display: block;
        height: 24px;
        background-color: #333333;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><polygon points="12,7 18,17 6,17" fill="%23FFFFFF"/></svg>');
        border: 2px solid #000000;
        cursor: pointer;
    }
    .list-container::-webkit-scrollbar-button:vertical:increment {
        display: block;
        height: 24px;
        background-color: #333333;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><polygon points="12,17 6,7 18,7" fill="%23FFFFFF"/></svg>');
        border: 2px solid #000000;
        cursor: pointer;
    }

    .name-list {
        list-style-type: none;
        padding: 0;
        margin: 0; 
    }

    .name-list li {
        padding: 0.5rem 0;
        border-bottom: 1px dashed #333333; 
        display: flex;
        justify-content: space-between;
    }

    .col-name { width: 25%; color: #FFFFFF; font-weight: normal; }
    .col-kt { width: 15%; color: #FFFFFF; }
    .col-job { width: 20%; color: #FFFFFF; }
    .col-offense { width: 25%; color: #FFFFFF; } 
    .col-date { width: 15%; text-align: right; color: #FFFFFF; }

    .action-bar {
        display: flex;
        gap: 1rem;
        margin-bottom: 4rem;
    }

    .action-btn {
        background: transparent;
        color: #FFFFFF;
        border: 1px solid #555555;
        padding: 0.5rem 1rem;
        font-family: inherit; /* Inherits Helvetica/Roboto */
        font-size: 0.9rem;
        font-weight: bold;
        cursor: pointer;
    }

    .action-btn:hover {
        background: #333333;
        color: #FFFFFF;
    }

    .end-log {
        font-weight: bold;
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-top: 2px solid #FFFFFF;
        padding-top: 1rem;
        margin-bottom: 2rem;
    }

    /* --- SITE FOOTER --- */
    .site-footer {
        max-width: 1200px;
        margin-top: 4rem;
        padding-top: 1rem;
        border-top: 1px dotted #333333;
        font-size: 0.75rem;
        color: #666666;
        display: flex;
        justify-content: space-between;
    }
</style>
</head>
<body>

    <!-- Header Section -->
    <header class="site-header">
        <h1 class="site-title">VIDARR.IS</h1>
        <div class="header-controls">
            <div class="search-box">
                <input type="text" placeholder="[ SEARCH DATABASE ]">
            </div>
            <!-- Secret button is the underscore right here -->
            <a href="https://vidarr.is/underconstruction.html" class="secret-btn">_</a>
        </div>
    </header>

    <!-- Navigation Menu -->
    <nav class="site-nav">
        <a href="#" class="active">PUBLICATION LOG</a>
        <a href="#">ABOUT DIRECTIVE</a>
        <a href="#">SECURE DROPBOX</a>
        <a href="#">PGP KEY</a>
    </nav>

    <div class="layout-wrapper">
        
        <!-- Sidebar / Context -->
        <aside class="sidebar">
            <h3>INDEX</h3>
            <ul class="backlog-list">
                <li>
                    <span class="date">SYS_INIT_00</span>
                    SERVER PROVISIONED<br>
                    <span style="color:#666; font-size: 0.8rem;">ROOT ACCESS SECURED</span>
                </li>
                <li class="current">
                    <span class="date">PUBLICATION_01</span>
                    THE LIST (503 RECORDS)<br>
                    <span style="color:#AAA; font-size: 0.8rem;">ACTIVE</span>
                </li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="list-container">
                <ul class="name-list" id="target-list">
                    <!-- JavaScript will populate the 503 names here -->
                </ul>
            </div>

            <div class="action-bar">
                <button class="action-btn">PRINT LOG</button>
                <button class="action-btn">EXPORT .CSV</button>
            </div>

            <div class="end-log">
                END OF LOG
            </div>
        </main>
        
    </div>

    <!-- Discreet Footer -->
    <footer class="site-footer">
        <span>SYS_VER: 1.0.4.88 // LOC: UNKNOWN // CONNECTION SECURE</span>
        <span>ENCRYPTION: AES-256 (GCM)</span>
    </footer>

    <script>
        const listContainer = document.getElementById('target-list');
        
        const firstNames = ["Jón", "Gunnar", "Ólafur", "Einar", "Magnús"]; 
        const lastNames = ["Jónsson", "Guðmundsson", "Sigurðsson", "Þórðarson", "Pálsson"];
        const jobs = ["Judge", "Lawyer", "Politician", "Artist", "CEO", "Surgeon", "Producer", "Banker"];
        const offenses = ["Rapist", "Child Molester", "Sexual Assault", "Predator", "Statutory Rape"];
        
        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getRandomDate() {
            const start = new Date(1990, 0, 1);
            const end = new Date(2023, 11, 31);
            const date = new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
            
            const day = String(date.getDate()).padStart(2, '0');
            const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sept", "oct", "nov", "dec"];
            const month = months[date.getMonth()];
            const year = date.getFullYear();
            
            return `${day} ${month} ${year}`; 
        }

        function getFakeKennitala() {
            const day = String(Math.floor(Math.random() * 28) + 1).padStart(2, '0');
            const month = String(Math.floor(Math.random() * 12) + 1).padStart(2, '0');
            const year = String(Math.floor(Math.random() * 50) + 40); 
            const randomEnd = String(Math.floor(Math.random() * 900) + 100) + '9'; 
            return `${day}${month}${year}-${randomEnd}`;
        }

        for(let i = 1; i <= 503; i++) {
            const li = document.createElement('li');
            
            if (i === 503) {
                li.innerHTML = `
                    <span class="col-name">503 - ARNAR VIGLUNDSSON</span>
                    <span class="col-kt">140865-2289</span>
                    <span class="col-job">CHIEF OF POLICE</span>
                    <span class="col-offense">RAPIST</span>
                    <span class="col-date">UNDISCLOSED</span>
                `;
            } else {
                const fullName = `${getRandom(firstNames)} ${getRandom(lastNames)}`.toUpperCase();
                const kennitala = getFakeKennitala();
                const job = getRandom(jobs).toUpperCase();
                const offense = getRandom(offenses).toUpperCase();
                const date = getRandomDate();

                li.innerHTML = `
                    <span class="col-name">${String(i).padStart(3, '0')} - ${fullName}</span>
                    <span class="col-kt">${kennitala}</span>
                    <span class="col-job">${job}</span>
                    <span class="col-offense">${offense}</span>
                    <span class="col-date">${date}</span>
                `;
            }
            
            listContainer.appendChild(li);
        }

        listContainer.scrollTop = listContainer.scrollHeight;
    </script>
</body>
</html>
